<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Кликер Планет</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#0c0c1e 0%,#1a1a3e 100%);font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#game-container{display:flex;width:100%;max-width:500px;height:100vh;position:relative}
#click-area{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;gap:20px}
#planet-btn{width:250px;height:250px;border-radius:50%;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .1s;touch-action:manipulation;border:none;background:transparent;overflow:hidden}
#planet-btn:active{transform:scale(.95)}
#planet-emoji{font-size:120px;position:absolute;z-index:2;pointer-events:none}
#planet-name{font-size:20px;color:#fff;font-weight:bold;text-align:center}
#clicks-display{font-size:30px;font-weight:bold;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.8)}
#menu-btn{position:absolute;left:15px;top:15px;z-index:100;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.3);border-radius:10px;padding:15px;cursor:pointer;color:#fff;font-size:24px;touch-action:manipulation}
#upgrade-menu{position:fixed;left:0;top:0;width:80%;height:100%;background:rgba(0,0,0,.95);z-index:1000;transform:translateX(-100%);transition:transform .3s;overflow-y:auto;padding:20px}
#upgrade-menu.active{transform:translateX(0)}
#close-menu{position:absolute;right:10px;top:10px;background:#e74c3c;border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;color:#fff;font-size:20px}
#menu-title{color:#fff;text-align:center;margin-bottom:20px;font-size:24px}
.upgrade-item{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:15px;margin-bottom:10px;cursor:pointer;color:#fff;transition:all .3s;touch-action:manipulation}
.upgrade-item:active{background:rgba(255,255,255,.2)}
.upgrade-name{font-size:18px;font-weight:bold}
.upgrade-desc{font-size:14px;opacity:.8;margin-top:5px}
.upgrade-cost{font-size:16px;color:#f1c40f;font-weight:bold;margin-top:5px}
#reset-btn{position:absolute;right:15px;top:15px;z-index:100;background:rgba(231,76,60,.5);border:2px solid rgba(231,76,60,.7);border-radius:10px;padding:15px;cursor:pointer;color:#fff;font-size:20px;touch-action:manipulation}
#monster-health{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:200px;height:20px;background:#333;border-radius:10px;overflow:hidden;display:none}
#monster-health-fill{height:100%;background:#e74c3c;width:100%}
.floating{position:absolute;pointer-events:none;animation:floatUp 1s ease-out;font-weight:bold;font-size:30px;color:#f1c40f;z-index:999}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-100px)}}
</style>
</head>
<body>
<div id="game-container">
<button id="menu-btn">☰</button>
<button id="reset-btn">🔄</button>
<div id="click-area">
<div id="monster-health"><div id="monster-health-fill"></div></div>
<button id="planet-btn">
<span id="planet-emoji">🌍</span>
</button>
<div id="planet-name">Земля</div>
<div id="clicks-display">0</div>
</div>
<div id="upgrade-menu">
<button id="close-menu">✕</button>
<h2 id="menu-title">🛒 Улучшения</h2>
<div id="upgrade-list"></div>
</div>
</div>

<script>
let currentClicks=0;
let totalClicks=0;
let perClick=1;
let autoClick=0;
let unlockedPlanet=0;
let monster=null;

// Загрузка сохранения
if(localStorage.getItem('planet_clicker_v2')){
const save=JSON.parse(localStorage.getItem('planet_clicker_v2'));
totalClicks=save.totalClicks||0;
perClick=save.perClick||1;
autoClick=save.autoClick||0;
unlockedPlanet=save.unlockedPlanet||0;
}

const planets=[
{name:'Земля',emoji:'🌍',min:0,next:1000,color:'#4AEDD9'},
{name:'Марс',emoji:'🔴',min:1000,next:5000,color:'#e74c3c'},
{name:'Юпитер',emoji:'🟤',min:5000,next:15000,color:'#d35400'},
{name:'Сатурн',emoji:'🪐',min:15000,next:30000,color:'#f39c12'},
{name:'Уран',emoji:'🔵',min:30000,next:60000,color:'#3498db'},
{name:'Нептун',emoji:'🔷',min:60000,next:100000,color:'#2980b9'},
{name:'Плутон',emoji:'⚪',min:100000,next:250000,color:'#ecf0f1'},
{name:'Черная дыра',emoji:'⚫',min:250000,next:Infinity,color:'#000'}
];

const monsters=[
{name:'Слайм',emoji:'🟢',hp:50,reward:100},
{name:'Зомби',emoji:'🧟',hp:100,reward:500},
{name:'Скелет',emoji:'💀',hp:200,reward:1000},
{name:'Дракон',emoji:'🐉',hp:500,reward:5000},
{name:'Босс',emoji:'👹',hp:1000,reward:10000}
];

const upgrades=[
{name:'Улучшить клик',desc:'+1 за клик',cost:50,effect:()=>{perClick++}},
{name:'Автокликер',desc:'+1 в секунду',cost:100,effect:()=>{autoClick++}},
{name:'Мега клик',desc:'+5 за клик',cost:500,effect:()=>{perClick+=5}},
{name:'Супер автокликер',desc:'+5 в секунду',cost:1000,effect:()=>{autoClick+=5}},
{name:'Ультра клик',desc:'+25 за клик',cost:5000,effect:()=>{perClick+=25}},
{name:'Мега буст',desc:'x2 за клик',cost:10000,effect:()=>{perClick*=2}},
{name:'Авто буст',desc:'x2 в секунду',cost:25000,effect:()=>{autoClick*=2}},
{name:'Гига клик',desc:'+100 за клик',cost:50000,effect:()=>{perClick+=100}},
{name:'Гига авто',desc:'+100 в секунду',cost:100000,effect:()=>{autoClick+=100}},
{name:'Максимум',desc:'Всё x5',cost:250000,effect:()=>{perClick*=5;autoClick*=5}}
];

function getCurrentPlanet(){
return planets[unlockedPlanet];
}

function updatePlanet(){
const planet=getCurrentPlanet();
document.getElementById('planet-emoji').textContent=planet.emoji;
document.getElementById('planet-name').textContent=planet.name;
}

function updateUI(){
const planet=getCurrentPlanet();
document.getElementById('clicks-display').textContent=currentClicks+' / '+planet.next;
updatePlanet();
renderUpgrades();
if(monster){
document.getElementById('monster-health').style.display='block';
document.getElementById('monster-health-fill').style.width=(monster.hp/monster.maxHp*100)+'%';
}else{
document.getElementById('monster-health').style.display='none';
}
}

function renderUpgrades(){
const list=document.getElementById('upgrade-list');
list.innerHTML='';
upgrades.forEach((upgrade,index)=>{
const div=document.createElement('div');
div.className='upgrade-item';
div.innerHTML=`
<div class="upgrade-name">${upgrade.name}</div>
<div class="upgrade-desc">${upgrade.desc}</div>
<div class="upgrade-cost">💰 ${upgrade.cost}</div>
`;
div.onclick=()=>buyUpgrade(index);
list.appendChild(div);
});
}

function buyUpgrade(index){
const upgrade=upgrades[index];
if(totalClicks>=upgrade.cost){
totalClicks-=upgrade.cost;
upgrade.effect();
upgrade.cost=Math.floor(upgrade.cost*1.5);
updateUI();
saveGame();
}
}

function clickHandler(e){
if(monster){
// Атака монстра
monster.hp-=perClick;
createFloatingNumber(e,'-'+perClick,'#e74c3c');
if(monster.hp<=0){
totalClicks+=monster.reward;
currentClicks+=monster.reward;
monster=null;
checkPlanetProgress();
}
}else{
// Обычный клик
currentClicks+=perClick;
totalClicks+=perClick;
createFloatingNumber(e,'+'+perClick,'#f1c40f');
checkPlanetProgress();
}
updateUI();
saveGame();
}

function checkPlanetProgress(){
const planet=getCurrentPlanet();
if(currentClicks>=planet.next&&planet.next!==Infinity){
unlockedPlanet++;
currentClicks=0;
monster=createMonster();
}
}

function createMonster(){
const monsterIndex=Math.min(unlockedPlanet,monsters.length-1);
const m=monsters[monsterIndex];
return{
name:m.name,
emoji:m.emoji,
hp:m.hp,
maxHp:m.hp,
reward:m.reward
};
}

function createFloatingNumber(e,text,color){
const floating=document.createElement('div');
floating.className='floating';
floating.textContent=text;
floating.style.color=color;
floating.style.left=e.clientX+'px';
floating.style.top=e.clientY+'px';
document.body.appendChild(floating);
setTimeout(()=>floating.remove(),1000);
}

function saveGame(){
localStorage.setItem('planet_clicker_v2',JSON.stringify({
totalClicks:totalClicks,
perClick:perClick,
autoClick:autoClick,
unlockedPlanet:unlockedPlanet
}));
}

function resetGame(){
if(confirm('Точно сбросить весь прогресс?')){
localStorage.removeItem('planet_clicker_v2');
location.reload();
}
}

// Обработчики
document.getElementById('planet-btn').addEventListener('click',clickHandler);
document.getElementById('planet-btn').addEventListener('touchstart',(e)=>{
e.preventDefault();
clickHandler(e.touches[0]);
});

document.getElementById('menu-btn').addEventListener('click',()=>{
document.getElementById('upgrade-menu').classList.add('active');
});
document.getElementById('menu-btn').addEventListener('touchstart',(e)=>{
e.preventDefault();
document.getElementById('upgrade-menu').classList.add('active');
});

document.getElementById('close-menu').addEventListener('click',()=>{
document.getElementById('upgrade-menu').classList.remove('active');
});
document.getElementById('close-menu').addEventListener('touchstart',(e)=>{
e.preventDefault();
document.getElementById('upgrade-menu').classList.remove('active');
});

document.getElementById('reset-btn').addEventListener('click',resetGame);
document.getElementById('reset-btn').addEventListener('touchstart',(e)=>{
e.preventDefault();
resetGame();
});

// Автоклик
setInterval(()=>{
if(autoClick>0){
if(monster){
monster.hp-=autoClick;
if(monster.hp<=0){
totalClicks+=monster.reward;
currentClicks+=monster.reward;
monster=null;
checkPlanetProgress();
}
}else{
currentClicks+=autoClick;
totalClicks+=autoClick;
checkPlanetProgress();
}
updateUI();
saveGame();
}
},1000);

updateUI();
</script>
</body>
</html>
